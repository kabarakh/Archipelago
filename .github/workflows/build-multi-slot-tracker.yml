name: Build Multi Slot Tracker apworld

# Packages worlds/multi_slot_tracker into a .apworld using Archipelago's own "Build APWorlds"
# launcher component (see docs/apworld specification.md -- "This is the recommended workflow for
# packaging your world to an .apworld."), then attaches the result to the GitHub Release that
# triggered the run. `workflow_dispatch` lets it be run manually (e.g. to sanity-check the build)
# without needing to cut a release; in that case the .apworld is only kept as a workflow artifact.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write  # to upload the built .apworld onto the triggering release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python ModuleUpdate.py --yes --force
          python Launcher.py --update_settings  # make sure host.yaml exists

      - name: Build the apworld
        run: python Launcher.py "Build APWorlds" -- "Multi Slot Tracker" --skip_open_folder

      - name: Verify output
        run: test -f build/apworlds/multi_slot_tracker.apworld

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: multi_slot_tracker-apworld
          path: build/apworlds/multi_slot_tracker.apworld
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            build/apworlds/multi_slot_tracker.apworld --clobber \
            --repo "${{ github.repository }}"
